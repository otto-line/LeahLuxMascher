    <style>
        .project-title { font-weight: normal; text-transform: uppercase; }
        p { font-size: clamp(14px, 1.6vw, 20px); }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 2em;
            margin-bottom: 2em;
        }
        .photo-grid img { width: 100%; object-fit: cover; }
        .photo-grid .landscape { grid-column: span 3; }
        .photo-grid .portrait { grid-column: span 1; }
    </style>
</head>

<script>
    const title = document.querySelector('.project-title');
    if (title) {
        title.style.cursor = 'pointer';
        title.addEventListener('mouseenter', () => {
            window.parent.postMessage({ hoverImage: '/Images/hover/Eavesdrop.png' }, '*');
