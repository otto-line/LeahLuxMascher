name: Generate Static Files from Sanity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files from Sanity
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: production
        run: npm run generate

      - name: Commit changes
        run: |
          git config --global user.email "bot@sanity.io"
          git config --global user.name "Sanity Bot"
          git add menu.json cv.json theme.css *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update generated files from Sanity" && git push)
