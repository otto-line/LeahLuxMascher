<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lux Mascher</title>
    <link rel="icon" type="image/jpeg" href="images/favicon/SCRIPT.jpg">
    <link href="style.css" rel="stylesheet" />
</head>
<body>
<div id="hotspot-text" style="
    position: fixed;
    top: 50px;
    left: 20px;
    max-width: 400px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.9);
    color: #f60b0b;
    font: 14px/1.6 Arial, sans-serif;
    border-radius: 0px;
    z-index: 200;
    display: none;
    pointer-events: none;
"></div>

<div id="hover-preview" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 25vw;
    height: 100vh;
    display: none;
    pointer-events: none;
    z-index: 100;
">
    <img id="hover-preview-img" src="" alt="" style="
        width: 100%;
        height: 100%;
        object-fit: contain;
    ">
</div>
<button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
 <div class="render"><div class="container">
        <div id="content">
        <iframe name="content" src="about.html">opening</iframe>
        </div>
    <div class="menu-container">
        <div class="title-background"> </div>  
        <div class="title-box" >
            <div>  <h1 class="title">leah<br>lux<br>mascher </h1> </div>         
        </div> 
         
    <div class="info"> 
       
               
    </div>
    <!--Projects start here--> 
    <div class="menu">
        <h1 class="menu-heading"> <a href="about.html" target="content"> Bio </a> </h1>
        <h1 class="menu-heading"> <a href="cv.html" target="content"> CV </a> </h1>
        <!-- <h1 class="menu-heading"> <a href="contact.html" target="content"> </a> </h1> -->
        <div class="menu-heading"> <h1>Projects</h1></div>
    
        
    <div id="project-menu-items"></div>
    </div>

    <div class="contact-box">
        <details>
            <summary>Contact</summary>
            <div class="contact-links">
                <a href="https://instagram.com/leahluxmascher" target="_blank">Instagram @leahluxmascher</a>
                <a href="https://youtube.com/@LeahLuxMascher" target="_blank">YouTube @LeahLuxMascher</a>
            </div>
        </details>
    </div>

    </div>

</div>

<script>
    const previewDiv = document.getElementById('hover-preview');
    const previewImg = document.getElementById('hover-preview-img');
    const menuContainer = document.querySelector('.menu-container');
    const menuToggle = document.getElementById('menu-toggle');
    const gridContainer = document.querySelector('.container');

    function hideMenuOnMobile() {
        if (window.innerWidth <= 480) {
            menuContainer.classList.add('menu-hidden');
            gridContainer.classList.add('menu-closed');
        }
    }

    menuToggle.addEventListener('click', () => {
        menuContainer.classList.toggle('menu-hidden');
        gridContainer.classList.toggle('menu-closed');
    });

    // Hide menu when static heading links (Bio, CV) are clicked
    document.querySelectorAll('.menu-heading a[target="content"]').forEach(link => {
        link.addEventListener('click', hideMenuOnMobile);
    });

    function attachHoverListeners() {
        document.querySelectorAll('.menu-items a[data-hover-image]').forEach(link => {
            link.addEventListener('mouseenter', () => {
                previewImg.src = link.dataset.hoverImage;
                previewDiv.style.display = 'block';
            });
            link.addEventListener('mouseleave', () => {
                previewDiv.style.display = 'none';
            });
        });
    }

    fetch('menu.json')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('project-menu-items');
            data.projects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'menu-items';
                if (p.spacerAfter) div.style.marginBottom = '1em';
                const a = document.createElement('a');
                a.href = p.href;
                a.target = 'content';
                if (p.hoverImage) a.dataset.hoverImage = p.hoverImage;
                a.textContent = p.year ? `${p.title} ${p.year}` : p.title;
                a.addEventListener('click', hideMenuOnMobile);
                div.appendChild(a);
                container.appendChild(div);
            });
            attachHoverListeners();
        });

    const hotspotTextDiv = document.getElementById('hotspot-text');

    window.addEventListener('message', (e) => {
        if (e.data && 'hoverImage' in e.data) {
            if (e.data.hoverImage) {
                previewImg.src = e.data.hoverImage;
                previewDiv.style.display = 'block';
            } else {
                previewDiv.style.display = 'none';
            }
        }
        if (e.data && 'hotspotText' in e.data) {
            if (e.data.hotspotText) {
                var d = e.data.hotspotText;
                hotspotTextDiv.innerHTML =
                    '<span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:3px;font-weight:bold;display:inline-block;">' + d.id + '</span>' +
                    '<br><span style="color:#e60000;font-weight:bold;display:inline-block;margin-top:6px;">' + d.title + '</span>' +
                    (d.description ? '<br><span style="color:#ffcc00;display:inline-block;margin-top:6px;">' + d.description + '</span>' : '');
                hotspotTextDiv.style.display = 'block';
            } else {
                hotspotTextDiv.style.display = 'none';
            }
        }
    });
</script>
</body>
</html>
